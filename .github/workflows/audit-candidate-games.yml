name: Audit candidate game packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/candidates/**"
      - "tools/audit_candidate_zip.py"
      - "tests/test_candidate_audit.py"
      - ".github/workflows/audit-candidate-games.yml"

permissions:
  contents: read

concurrency:
  group: audit-candidate-games-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test candidate evidence scanner
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_candidate_audit.py -v

      - name: Audit unresolved candidate packages
        run: |
          set -euo pipefail
          mkdir -p candidate-audits
          shopt -s nullglob
          candidates=(research/candidates/*.json)
          if [ ${#candidates[@]} -eq 0 ]; then
            echo "No candidate manifests found."
            exit 0
          fi

          audited=0
          for manifest in "${candidates[@]}"; do
            readarray -t fields < <(python3 - "$manifest" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1], encoding='utf-8'))
          print(record['id'])
          print(record.get('status', 'RIGHTS_REVIEW_ONLY'))
          PY
            )
            id="${fields[0]}"
            status="${fields[1]}"

            if [ "$status" != "RIGHTS_REVIEW_ONLY" ]; then
              echo "Skipping resolved candidate $id ($status)"
              continue
            fi

            echo "::group::Candidate audit: $id"
            python3 tools/audit_candidate_zip.py "$manifest" --output "candidate-audits/$id.json"
            echo "::endgroup::"
            audited=$((audited + 1))
          done

          echo "Audited $audited unresolved candidate package(s)."

      - name: Upload non-publishing audit records
        uses: actions/upload-artifact@v4
        with:
          name: candidate-package-audits
          path: candidate-audits/*.json
          if-no-files-found: ignore
          retention-days: 7
