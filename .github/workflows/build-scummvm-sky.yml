name: Build ScummVM Freeware Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runtime/scummvm-build.json"
      - "runtime/sources/**"
      - "docs/rights/**"
      - "tools/materialize_scummvm_games.py"
      - "patches/scummvm-emscripten-relative-data.patch"
      - "patches/scummvm-emscripten-midi-permission.patch"
      - ".github/workflows/build-scummvm-sky.yml"

permissions:
  contents: write

concurrency:
  group: build-scummvm-freeware
  cancel-in-progress: true

jobs:
  build-scummvm-freeware:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCUMMVM_COMMIT: fed42f2068dcafc6aafa1c28c77e4c88def74b66
      SCUMMVM_VERSION: 2026.3.0
      EMSDK_VERSION: 4.0.10

    steps:
      - name: Check out Abandonware
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned ScummVM source
        uses: actions/checkout@v4
        with:
          repository: scummvm/scummvm
          ref: fed42f2068dcafc6aafa1c28c77e4c88def74b66
          path: scummvm-src
          fetch-depth: 1

      - name: Validate pinned build manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest_path = Path('runtime/scummvm-build.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          runtime = manifest['runtime']
          games = manifest.get('games') or [manifest['game']]
          engines = runtime.get('engines') or [runtime['engine']]

          assert runtime['commit'] == 'fed42f2068dcafc6aafa1c28c77e4c88def74b66'
          assert runtime['version'] == '2026.3.0'
          assert runtime['emsdk'] == '4.0.10'
          assert games
          assert engines
          assert len({game['id'] for game in games}) == len(games)
          assert len({game['target'] for game in games}) == len(games)
          assert set(game.get('engine', game['target']) for game in games).issubset(set(engines))

          input_paths = {
              manifest_path,
              Path('tools/materialize_scummvm_games.py'),
              Path('patches/scummvm-emscripten-relative-data.patch'),
              Path('patches/scummvm-emscripten-midi-permission.patch'),
              Path('.github/workflows/build-scummvm-sky.yml'),
          }

          for game in games:
              assert len(game['sha256']) == 64
              assert game['source_url'].startswith('https://')
              rights_record = Path(game['rights_record'])
              assert rights_record.is_file(), rights_record
              input_paths.add(rights_record)

              source_record_value = game.get('corresponding_source_record')
              if source_record_value:
                  source_record = Path(source_record_value)
                  assert source_record.is_file(), source_record
                  input_paths.add(source_record)
                  source_provenance = json.loads(source_record.read_text(encoding='utf-8'))
                  archive_path = source_record.parent / source_provenance['archive_file']
                  assert archive_path.is_file(), archive_path
                  input_paths.add(archive_path)

              for value in game.get('external_license_files', []):
                  evidence = Path(value)
                  assert evidence.is_file(), evidence
                  input_paths.add(evidence)

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          fingerprint = {
              path.as_posix(): digest(path)
              for path in sorted(input_paths, key=lambda item: item.as_posix())
          }
          fingerprint_path = Path(os.environ['RUNNER_TEMP']) / 'scummvm-build-inputs.json'
          fingerprint_path.write_text(
              json.dumps(fingerprint, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          print(
              f"Pinned manifest validated: {len(engines)} engine(s), "
              f"{len(games)} game(s), {len(fingerprint)} immutable build/evidence input(s)"
          )
          PY
          test "$(git -C scummvm-src rev-parse HEAD)" = "$SCUMMVM_COMMIT"
          test -s patches/scummvm-emscripten-relative-data.patch
          test -s patches/scummvm-emscripten-midi-permission.patch

      - name: Apply reviewed Emscripten hosting patches
        run: |
          set -euo pipefail
          for patch in \
            ../patches/scummvm-emscripten-relative-data.patch \
            ../patches/scummvm-emscripten-midi-permission.patch; do
            git -C scummvm-src apply --check "$patch"
            git -C scummvm-src apply "$patch"
          done
          grep -Fq '_url = Common::String(".") + _path;' scummvm-src/backends/fs/emscripten/http-fs.cpp
          grep -Fq 'MIDI access unavailable; continuing without browser MIDI.' scummvm-src/dists/emscripten/custom_shell-pre.js
          test "$(git -C scummvm-src rev-parse HEAD)" = "$SCUMMVM_COMMIT"
          echo "Applied reviewed browser-hosting patches without changing the pinned source commit."

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: scummvm-src/dists/emscripten/emsdk-4.0.10
          key: scummvm-emsdk-4.0.10

      - name: Build pinned ScummVM Web engines
        run: |
          set -euo pipefail
          mapfile -t engines < <(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('runtime/scummvm-build.json').read_text(encoding='utf-8'))
          runtime = manifest['runtime']
          for engine in runtime.get('engines') or [runtime['engine']]:
              print(engine)
          PY
          )

          # ScummVM's Emscripten configure path maps these explicit feature flags to
          # Emscripten ports. Sludge requires PNG support to compile and Robin's Rescue
          # contains Ogg/Vorbis audio, so both image and audio codecs are hard build gates.
          args=(build --enable-release --disable-all-engines --enable-png --enable-zlib --enable-ogg --enable-vorbis)
          for engine in "${engines[@]}"; do
            args+=("--enable-engine=$engine")
          done

          printf 'ScummVM build args:'
          printf ' %q' "${args[@]}"
          printf '\n'

          cd scummvm-src
          ./dists/emscripten/build.sh "${args[@]}"

          # A requested --enable-engine flag is not proof that configure retained the
          # engine: unmet dependencies can disable it while the build still exits 0.
          # Require each requested engine's static archive to exist after compilation.
          for engine in "${engines[@]}"; do
            archive="engines/$engine/lib$engine.a"
            if [ ! -s "$archive" ]; then
              echo "Requested ScummVM engine was not actually built: $engine ($archive missing)" >&2
              exit 1
            fi
            echo "Verified compiled engine: $engine -> $archive"
          done

          # Robin's Rescue exposed that a compiled engine is not sufficient proof of
          # runtime media support. Require the decoder feature actually used by its Ogg
          # assets to survive configure as well.
          grep -Eq '^#define USE_VORBIS([[:space:]]|$)' config.h || {
            echo "ScummVM was built without USE_VORBIS despite --enable-vorbis" >&2
            exit 1
          }
          echo "Verified compiled Vorbis decoder support."

      - name: Verify and materialize audited game data
        run: |
          set -euo pipefail
          python3 tools/materialize_scummvm_games.py \
            runtime/scummvm-build.json \
            scummvm-src/build-emscripten

          python3 scummvm-src/dists/emscripten/build-make_http_index.py \
            scummvm-src/build-emscripten/data

          cp scummvm-src/build-emscripten/scummvm.html \
            scummvm-src/build-emscripten/index.html

      - name: Preserve runtime and game licensing records
        run: |
          set -euo pipefail
          root=scummvm-src/build-emscripten
          mkdir -p "$root/legal" "$root/patches"
          cp scummvm-src/COPYING "$root/legal/SCUMMVM-COPYING"
          cp scummvm-src/COPYRIGHT "$root/legal/SCUMMVM-COPYRIGHT"
          cp patches/scummvm-emscripten-relative-data.patch "$root/patches/scummvm-emscripten-relative-data.patch"
          cp patches/scummvm-emscripten-midi-permission.patch "$root/patches/scummvm-emscripten-midi-permission.patch"
          if [ -d scummvm-src/LICENSES ]; then
            cp -a scummvm-src/LICENSES "$root/legal/LICENSES"
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil

          manifest = json.loads(Path('runtime/scummvm-build.json').read_text(encoding='utf-8'))
          runtime = manifest['runtime']
          games = manifest.get('games') or [manifest['game']]
          engines = runtime.get('engines') or [runtime['engine']]
          root = Path('scummvm-src/build-emscripten')

          lines = [
              '# Corresponding source and build record',
              '',
              f"This browser runtime is built from ScummVM {runtime['version']} at pinned commit:",
              '',
              f"`{runtime['commit']}`",
              '',
              'Corresponding upstream source:',
              '',
              f"https://github.com/{runtime['repository']}/tree/{runtime['commit']}",
              '',
              'Abandonware browser-hosting patches:',
              '',
              '- `patches/scummvm-emscripten-relative-data.patch` changes only the HTTP URL backing the virtual `/data` filesystem from origin-absolute `/data` to document-relative `./data`. This keeps ScummVM virtual paths unchanged while allowing static hosting below an origin path.',
              '- `patches/scummvm-emscripten-midi-permission.patch` handles a browser rejection of optional Web MIDI/SysEx access and continues without MIDI instead of leaving an unhandled promise rejection.',
              '',
              'Enabled game engines:',
              '',
          ]
          lines.extend(f'- `{engine}`' for engine in engines)
          lines.extend(['', 'Audited game-data packages:', ''])
          lines.extend(
              f"- {game['title']} — target `{game['target']}` — rights: `{game['rights_record']}`"
              for game in games
          )
          lines.extend([
              '',
              'Build method:',
              '',
              '1. Check out the pinned ScummVM commit.',
              '2. Apply both checked-in Emscripten browser-hosting patches.',
              '3. Run `./dists/emscripten/build.sh build --enable-release --disable-all-engines --enable-png --enable-zlib --enable-ogg --enable-vorbis ' +
              ' '.join(f'--enable-engine={engine}' for engine in engines) + '`.',
              '4. Verify every requested engine produced its static library and Vorbis support survived configuration.',
              '5. SHA-256 verify and materialize each audited game-data package.',
              '',
              'Game-data licenses are separate from ScummVM GPL licensing.',
              '',
          ])
          (root / 'SOURCE.md').write_text('\n'.join(lines), encoding='utf-8')

          # Keep source-backed open-license evidence inside the generated browser
          # artifact as well as in runtime/sources, so a deployed runtime remains
          # self-describing even when viewed independently of the repository docs.
          for game in games:
              if game.get('rights_basis') != 'open_license':
                  continue
              destination = root / 'legal' / 'games' / game['id']
              destination.mkdir(parents=True, exist_ok=True)
              shutil.copy2(game['rights_record'], destination / 'RIGHTS.md')
              shutil.copy2(
                  game['corresponding_source_record'],
                  destination / 'SOURCE-PROVENANCE.json',
              )
              for value in game.get('external_license_files', []):
                  source = Path(value)
                  shutil.copy2(source, destination / source.name)
          PY

      - name: Validate static runtime package
        run: |
          set -euo pipefail
          root=scummvm-src/build-emscripten
          test -s "$root/index.html"
          test -s "$root/scummvm.js"
          test -s "$root/scummvm.wasm"
          test -s "$root/scummvm.ini"
          test -s "$root/data/index.json"
          test -s "$root/PROVENANCE.json"
          test -s "$root/SOURCE.md"
          test -s "$root/legal/SCUMMVM-COPYING"
          test -s "$root/patches/scummvm-emscripten-relative-data.patch"
          test -s "$root/patches/scummvm-emscripten-midi-permission.patch"

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('runtime/scummvm-build.json').read_text(encoding='utf-8'))
          provenance = json.loads(Path('scummvm-src/build-emscripten/PROVENANCE.json').read_text(encoding='utf-8'))
          games = manifest.get('games') or [manifest['game']]
          recorded = {game['id']: game for game in provenance.get('games', [])}
          assert len(recorded) == len(games)
          for game in games:
              current = recorded[game['id']]
              assert current['sha256'] == game['sha256']
              assert current['target'] == game['target']
              assert current['relative_game_path'] == game.get('relative_game_path', '.')
              assert current.get('required_files', []) == game.get('required_files', [])
              assert current.get('rights_basis') == game.get('rights_basis', 'freeware_redistribution')

              if game.get('rights_basis') == 'open_license':
                  legal = Path('scummvm-src/build-emscripten/legal/games') / game['id']
                  assert (legal / 'RIGHTS.md').is_file()
                  assert (legal / 'SOURCE-PROVENANCE.json').is_file()
                  for value in game.get('external_license_files', []):
                      assert (legal / Path(value).name).is_file()

          print(f"Validated runtime provenance and licensing for {len(games)} game(s)")
          PY

          if find "$root" -type f -size +95M -print -quit | grep -q .; then
            echo "A generated ScummVM file exceeds the 95 MB repository safety threshold:" >&2
            find "$root" -type f -size +95M -print >&2
            exit 1
          fi

          echo "Runtime package size: $(du -sh "$root" | cut -f1)"
          find "$root" -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Materialize runtime into Abandonware
        run: |
          set -euo pipefail
          rm -rf runtime/scummvm
          mkdir -p runtime/scummvm
          cp -a scummvm-src/build-emscripten/. runtime/scummvm/

      - name: Commit generated runtime safely
        run: |
          set -euo pipefail
          git config user.name "abandonware-preservation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/scummvm
          if git diff --cached --quiet; then
            echo "ScummVM runtime already matches its pinned manifest."
            exit 0
          fi
          git commit -m "build: materialize audited ScummVM browser runtime"

          verify_build_inputs() {
            python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          fingerprint_path = Path(os.environ['RUNNER_TEMP']) / 'scummvm-build-inputs.json'
          expected = json.loads(fingerprint_path.read_text(encoding='utf-8'))

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          failures = []
          for value, expected_hash in expected.items():
              path = Path(value)
              if not path.is_file():
                  failures.append(f"missing: {value}")
                  continue
              actual = digest(path)
              if actual != expected_hash:
                  failures.append(f"changed: {value} expected={expected_hash} actual={actual}")

          if failures:
              raise SystemExit(
                  "Build/evidence inputs changed while runtime was compiling; refusing stale publish:\n" +
                  "\n".join(failures)
              )
          print(f"Verified {len(expected)} build/evidence inputs are unchanged after rebase")
          PY
          }

          for attempt in 1 2 3 4; do
            echo "Publish attempt $attempt/4"
            git fetch origin main
            git rebase origin/main
            verify_build_inputs
            if git push origin HEAD:main; then
              echo "Published generated ScummVM runtime."
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep "$attempt"
            fi
          done

          echo "Could not publish generated runtime after 4 race-safe attempts." >&2
          exit 1
