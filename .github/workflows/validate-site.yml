name: Validate archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "restoration.css"
      - "covers-extra.css"
      - "data/**"
      - "games/**"
      - "runtime/**"
      - "docs/rights/**"
      - "patches/**"
      - "tests/test_*.py"
      - "tools/materialize_scummvm_games.py"
      - ".github/workflows/validate-site.yml"

permissions:
  contents: read

concurrency:
  group: validate-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check app.js
          node --check data/games.js
          node --check runtime/jsdos/bridge.js

      - name: Run ScummVM intake unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate catalog-to-artifact links
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          global.window = {};
          require('./data/games.js');
          const games = window.ABANDONWARE_GAMES;
          const scummvmProvenance = JSON.parse(fs.readFileSync('runtime/scummvm/PROVENANCE.json', 'utf8'));
          const scummvmTargets = new Set((scummvmProvenance.games || []).map(game => game.target));

          if (!Array.isArray(games) || games.length === 0) {
            throw new Error('Catalog did not initialize');
          }

          const ids = new Set();
          for (const game of games) {
            if (!game.id || ids.has(game.id)) throw new Error(`Duplicate or missing game id: ${game.id}`);
            ids.add(game.id);

            if (!game.title || !game.status || !game.runtime) {
              throw new Error(`Incomplete catalog record: ${game.id}`);
            }

            if (game.hostable) {
              if (game.status !== 'BROWSER READY') {
                throw new Error(`${game.id} is hostable but is not marked BROWSER READY`);
              }

              const artifactPath = String(game.hostedUrl || '').split(/[?#]/, 1)[0];
              if (!artifactPath || !fs.existsSync(artifactPath)) {
                throw new Error(`${game.id} points at missing hosted artifact ${game.hostedUrl}`);
              }
              if (!game.rightsRecord || !fs.existsSync(game.rightsRecord)) {
                throw new Error(`${game.id} has no accessible rights record`);
              }
              if (!game.sourcePage) {
                throw new Error(`${game.id} has no source/provenance page`);
              }

              if (game.runtimeType === 'scummvm') {
                const hashIndex = String(game.hostedUrl).indexOf('#');
                const target = hashIndex >= 0 ? String(game.hostedUrl).slice(hashIndex + 1) : '';
                if (!target || !scummvmTargets.has(target)) {
                  throw new Error(`${game.id} points at unaudited ScummVM target ${target || '(missing)'}`);
                }
              }
            }
          }

          const hosted = games.filter(game => game.hostable);
          const engines = new Set(hosted.map(game => game.runtimeType || 'jsdos'));
          console.log(`Validated ${games.length} records, ${hosted.length} hosted titles, ${engines.size} runtime types.`);
          NODE

      - name: Verify all audited DOS bundles
        run: |
          set -euo pipefail
          for manifest in games/manifests/*.json; do
            python3 tools/verify_audited_bundle.py "$manifest"
          done

      - name: Verify pinned js-dos preservation record
        run: |
          set -euo pipefail
          test -s runtime/jsdos/js-dos.js
          test -s runtime/jsdos/js-dos.css
          test -s runtime/jsdos/bridge.js
          test -s runtime/jsdos/PROVENANCE.json
          test -s runtime/jsdos/SOURCE.md
          test -s runtime/jsdos/legal/JSDOS-PACKAGE.json
          test -s runtime/jsdos/legal/GPL-2.0-TEXT
          find runtime/jsdos/emulators -type f -print -quit | grep -q .

          grep -q 'runtime/jsdos/js-dos.css' index.html
          grep -q 'runtime/jsdos/js-dos.js' index.html
          grep -q 'runtime/jsdos/bridge.js' index.html
          grep -q 'runtime/jsdos/emulators/' runtime/jsdos/bridge.js

          if grep -q 'v8\.js-dos\.com/latest' index.html; then
            echo 'Mutable js-dos /latest CDN dependency reintroduced into index.html' >&2
            exit 1
          fi

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          build = json.loads(Path('runtime/jsdos-build.json').read_text(encoding='utf-8'))
          provenance = json.loads(Path('runtime/jsdos/PROVENANCE.json').read_text(encoding='utf-8'))

          assert provenance['runtime']['version'] == build['runtime']['version'] == '8.4.1'
          assert provenance['runtime']['commit'] == build['runtime']['commit']
          assert provenance['runtime']['release_sha256'] == build['runtime']['release_sha256']
          assert provenance['emulators']['commit'] == build['emulators']['commit']

          for name in ('js-dos.js', 'js-dos.css'):
              actual = hashlib.sha256((Path('runtime/jsdos') / name).read_bytes()).hexdigest()
              assert actual == provenance['materialized_files'][name], f'{name} no longer matches provenance'

          print('Pinned js-dos 8.4.1 runtime and local emulator bridge verified.')
          PY

      - name: Verify ScummVM preservation record
        run: |
          set -euo pipefail
          test -s runtime/scummvm/index.html
          test -s runtime/scummvm/scummvm.js
          test -s runtime/scummvm/scummvm.wasm
          test -s runtime/scummvm/scummvm.ini
          test -s runtime/scummvm/PROVENANCE.json
          test -s runtime/scummvm/SOURCE.md
          test -s runtime/scummvm/legal/SCUMMVM-COPYING
          test -s runtime/scummvm/patches/scummvm-emscripten-relative-data.patch
          test -s runtime/scummvm/patches/scummvm-emscripten-midi-permission.patch
          cmp patches/scummvm-emscripten-relative-data.patch runtime/scummvm/patches/scummvm-emscripten-relative-data.patch
          cmp patches/scummvm-emscripten-midi-permission.patch runtime/scummvm/patches/scummvm-emscripten-midi-permission.patch

          python3 - <<'PY'
          import json
          from pathlib import Path

          build = json.loads(Path('runtime/scummvm-build.json').read_text(encoding='utf-8'))
          provenance = json.loads(Path('runtime/scummvm/PROVENANCE.json').read_text(encoding='utf-8'))

          assert provenance['runtime']['commit'] == build['runtime']['commit']
          assert provenance['runtime']['version'] == build['runtime']['version']

          build_games = build.get('games') or [build['game']]
          provenance_games = provenance.get('games') or [provenance['game']]
          indexed_provenance = {game['id']: game for game in provenance_games}

          for game in build_games:
              game_id = game['id']
              assert game_id in indexed_provenance, f'Missing ScummVM provenance for {game_id}'
              recorded = indexed_provenance[game_id]
              assert recorded['sha256'] == game['sha256']
              assert recorded['rights_record'] == game['rights_record']
              assert recorded['target'] == game['target']
              assert recorded['relative_game_path'] == game.get('relative_game_path', '.')
              assert recorded.get('required_files', []) == game.get('required_files', [])
              assert recorded.get('target_direct_files'), f'No direct target payload recorded for {game_id}'
              rights_path = Path(game['rights_record'])
              assert rights_path.is_file(), f'Missing rights record for {game_id}: {rights_path}'

          source = Path('runtime/scummvm/SOURCE.md').read_text(encoding='utf-8')
          assert 'scummvm-emscripten-relative-data.patch' in source
          assert 'scummvm-emscripten-midi-permission.patch' in source
          print(f'ScummVM runtime provenance matches {len(build_games)} exact game path(s).')
          PY
